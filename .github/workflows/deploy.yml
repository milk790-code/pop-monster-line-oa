name: Deploy Pop Monster LINE OA

# pop-monster-webhook is not necessarily the bot LINE uses for this OA. Since
# 2026-06 the Pop Monster OA (@150tiznd) sends its events to pop-line-oa (repo
# 3q-hatchery-line-oa). This workflow therefore never repoints the OA's webhook
# or default rich menu on its own: it only re-applies them when LINE already
# sends events to this worker, or when a person runs it by hand with
# take_over_line = true.

on:
  workflow_dispatch:
    inputs:
      take_over_line:
        description: 'Point the LINE OA webhook and default rich menu at THIS worker even if LINE sends events to another bot (e.g. pop-line-oa). This switches the live bot for every customer.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'webhook/worker.js'
      - 'assets/exports/pop-monster-richmenu-2500x1686.jpg'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ['Render PNG assets']
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      issues: write
    env:
      PNG_BASE_URL: https://milk790-code.github.io/pop-monster-line-oa/assets/exports
      WORKER_NAME: pop-monster-webhook
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$resp" | jq -e '.success == true' > /dev/null
          echo "::notice::CF token OK ($(echo "$resp" | jq -r '.result.status'))"

      - name: Verify LINE token
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: Bearer $LINE_TOKEN" \
            https://api.line.me/v2/bot/info)
          name=$(echo "$resp" | jq -r '.displayName // empty')
          if [ -z "$name" ]; then
            echo "::error::LINE token bad: $resp"
            exit 1
          fi
          echo "::notice::LINE bot: $name ($(echo "$resp" | jq -r '.basicId'))"

      - name: Set Cloudflare account ID
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::CF_ACCOUNT_ID secret is empty"
            exit 1
          fi
          echo "CF_ACCOUNT_ID=$CF_ACCOUNT_ID" >> $GITHUB_ENV
          echo "::notice::Using CF account ID (hidden)"

      # Read-only. Anything it cannot read stops the run before the upload.
      - name: Pre-flight (read-only) — live version, worker config, LINE webhook
        env:
          CF_TOKEN:   ${{ secrets.CF_API_TOKEN }}
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          CF="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"

          SUB=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$CF/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            echo "::error::Could not read the workers.dev subdomain"
            exit 1
          fi
          WORKER_URL="https://${WORKER_NAME}.${SUB}.workers.dev"
          echo "WORKER_URL=$WORKER_URL" >> $GITHUB_ENV

          # The first deployment in the list is the one serving traffic.
          prev=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$CF/workers/scripts/${WORKER_NAME}/deployments" \
            | jq -r '.result.deployments[0].versions[0].version_id // empty')
          if [ -z "$prev" ]; then
            echo "::error::Could not read the active deployment of $WORKER_NAME"
            exit 1
          fi
          echo "PREV_VERSION_ID=$prev" >> $GITHUB_ENV
          echo "::notice::Version serving traffic before this run: $prev"

          if ! body=$(curl -sS --fail --max-time 15 "$WORKER_URL"); then
            echo "::error::Could not read $WORKER_URL before deploy"
            exit 1
          fi
          before=$(echo "$body" | jq -cS '{token: .configured.token, secret: .configured.secret, anthropic: .configured.anthropic}')
          if [ "$before" != '{"anthropic":true,"secret":true,"token":true}' ]; then
            echo "::error::The live worker is already missing a secret ($before). Fix its secrets on Cloudflare before deploying."
            exit 1
          fi
          echo "$before" > /tmp/configured-before.json
          echo "::notice::Worker config before deploy: $before"

          if ! ep=$(curl -sS --fail -H "Authorization: Bearer $LINE_TOKEN" https://api.line.me/v2/bot/channel/webhook/endpoint); then
            echo "::error::Could not read the LINE webhook endpoint"
            exit 1
          fi
          endpoint=$(echo "$ep" | jq -r '.endpoint // ""')
          active=$(echo "$ep" | jq -r '.active // false')
          echo "PREV_WEBHOOK_ENDPOINT=${endpoint:-(none)}" >> $GITHUB_ENV

          # Recorded so a failed take-over can be put back. Not fatal: 404 means no default menu.
          dm_code=$(curl -sS -o /tmp/default-menu.json -w "%{http_code}" -H "Authorization: Bearer $LINE_TOKEN" \
            https://api.line.me/v2/bot/user/all/richmenu || true)
          case "$dm_code" in
            200) prev_menu=$(jq -r '.richMenuId // "unknown"' /tmp/default-menu.json 2>/dev/null || echo unknown) ;;
            404) prev_menu=none ;;
            403) prev_menu=oa-manager ;;
            *)   prev_menu=unknown ;;
          esac
          echo "PREV_DEFAULT_RICH_MENU_ID=$prev_menu" >> $GITHUB_ENV
          echo "::notice::Default rich menu before this run: $prev_menu"

          if [ "${endpoint%/}" = "$WORKER_URL" ] && [ "$active" = "true" ]; then
            echo "LINE_IS_THIS_WORKER=true" >> $GITHUB_ENV
            echo "::notice::LINE sends this OA's events to this worker"
          else
            echo "LINE_IS_THIS_WORKER=false" >> $GITHUB_ENV
            echo "::notice::LINE sends this OA's events to ${endpoint:-(none)} (active=$active), not to this worker. Customers are not on $WORKER_NAME; the rich menu and webhook URL will not be touched."
          fi

      - name: Deploy Worker (code + PNG_BASE_URL; secrets stay as they are on Cloudflare)
        id: upload
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p _debug

          # No secrets are sent. keep_bindings tells Cloudflare to carry every
          # secret over from the previous version (the same request `wrangler
          # versions upload` makes). Worker secrets are managed with `wrangler
          # secret put` or the dashboard: ANTHROPIC_API_KEY was added there on
          # 2026-06-03 and never existed in GitHub, so the old full binding list
          # would have deleted it.
          jq -n --arg png "$PNG_BASE_URL" '{
            main_module: "worker.js",
            compatibility_date: "2024-12-01",
            keep_bindings: ["secret_text", "secret_key"],
            bindings: [ {name: "PNG_BASE_URL", type: "plain_text", text: $png} ]
          }' > /tmp/metadata.json
          cp /tmp/metadata.json _debug/metadata.json

          set +e
          http_code=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=@/tmp/metadata.json;type=application/json" \
            -F "worker.js=@webhook/worker.js;type=application/javascript+module" \
            -o _debug/cf-deploy-response.json -w "%{http_code}")
          curl_exit=$?
          set -e

          echo "$http_code" > _debug/cf-deploy-http-code.txt
          echo "$curl_exit" > _debug/cf-deploy-curl-exit.txt

          ok=$(jq -r '.success // false' _debug/cf-deploy-response.json 2>/dev/null || echo "parse-error")
          if [ "$ok" != "true" ]; then
            echo "DEPLOY FAILED — http=$http_code curl_exit=$curl_exit ok=$ok"
            echo "Response:"
            cat _debug/cf-deploy-response.json
            exit 1
          fi
          echo "Worker uploaded (etag=$(jq -r '.result.etag' _debug/cf-deploy-response.json))"

      - name: CF deploy diagnostics (summary only)
        if: always()
        run: |
          echo "## CF Deploy Diagnostics" >> $GITHUB_STEP_SUMMARY
          if [ -d _debug ]; then
            for f in _debug/*; do [ -f "$f" ] || continue;
              echo "### \`$f\`" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              head -c 3000 "$f" >> $GITHUB_STEP_SUMMARY
              echo >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            done
            rm -rf _debug
          fi

      - name: Enable workers.dev subdomain
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"enabled": true}' \
            | jq -e '.success == true' > /dev/null
          echo "::notice::Worker URL: $WORKER_URL"

      - name: Smoke-test Worker URL
        run: |
          set -euo pipefail
          sleep 5
          if ! resp=$(curl -sS --fail --max-time 15 "$WORKER_URL"); then
            echo "::error::$WORKER_URL did not answer after deploy"
            exit 1
          fi
          echo "$resp" | jq .
          after=$(echo "$resp" | jq -cS '{token: .configured.token, secret: .configured.secret, anthropic: .configured.anthropic}')
          before=$(cat /tmp/configured-before.json)
          if [ "$after" != "$before" ]; then
            echo "::error::Worker configuration changed during deploy: before=$before after=$after"
            exit 1
          fi
          echo "::notice::Worker is alive and configured: $after"

      # A take-over stops here, before anything customers see changes, unless LINE
      # can verify this worker. webhook/test only sends a signed test request to
      # the URL given; it does not change the OA's settings.
      - name: Check LINE can verify this worker before switching
        if: github.event_name != 'push' && env.LINE_IS_THIS_WORKER != 'true' && inputs.take_over_line
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            resp=$(curl -sS -X POST \
              https://api.line.me/v2/bot/channel/webhook/test \
              -H "Authorization: Bearer $LINE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"endpoint\":\"$WORKER_URL\"}" || true)
            echo "$resp" | jq . 2>/dev/null || echo "$resp"
            if echo "$resp" | jq -e '.success == true' > /dev/null 2>&1; then
              echo "::notice::LINE verified $WORKER_URL; switching"
              exit 0
            fi
            if [ "$attempt" != "3" ]; then
              sleep 10
            fi
          done
          echo "::error::LINE could not verify $WORKER_URL, so customers were NOT switched. Last response: $resp"
          exit 1

      # The next four steps change where LINE sends events and what every
      # customer sees as the rich menu. They never run on a code push, and on
      # other runs only when LINE already uses this worker or take_over_line is set.
      - name: Ensure LINE Rich Menu (reuse by name, else create)
        if: github.event_name != 'push' && (env.LINE_IS_THIS_WORKER == 'true' || inputs.take_over_line)
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          RM_NAME: 'Pop Monster · MENU (postback v1)'
        run: |
          set -euo pipefail

          # 1. Look for existing rich menu by name
          existing=$(curl -sS -H "Authorization: Bearer $LINE_TOKEN" \
            https://api.line.me/v2/bot/richmenu/list \
            | jq -r --arg n "$RM_NAME" '.richmenus[] | select(.name == $n) | .richMenuId' \
            | head -1)

          if [ -n "$existing" ]; then
            echo "RICH_MENU_ID=$existing" >> $GITHUB_ENV
            echo "::notice::Reusing existing Rich Menu: $existing"
            exit 0
          fi

          # 2. Create new
          cat > /tmp/richmenu.json <<'JSON'
          {
            "size": {"width": 2500, "height": 1686},
            "selected": false,
            "name": "Pop Monster · MENU (postback v1)",
            "chatBarText": "MENU",
            "areas": [
              {"bounds": {"x":    0, "y":   0, "width": 2500, "height": 800}, "action": {"type": "uri",      "uri":  "https://popmonster.vip"}},
              {"bounds": {"x":    0, "y": 800, "width":  625, "height": 886}, "action": {"type": "postback", "data": "menu:catalog"}},
              {"bounds": {"x":  625, "y": 800, "width":  625, "height": 886}, "action": {"type": "postback", "data": "menu:howto"}},
              {"bounds": {"x": 1250, "y": 800, "width":  625, "height": 886}, "action": {"type": "uri",      "uri":  "https://s.shopee.tw/3fzneUIhU0"}},
              {"bounds": {"x": 1875, "y": 800, "width":  625, "height": 886}, "action": {"type": "postback", "data": "menu:support"}}
            ]
          }
          JSON

          resp=$(curl -sS -X POST https://api.line.me/v2/bot/richmenu \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/richmenu.json)
          RM_ID=$(echo "$resp" | jq -r '.richMenuId // empty')
          if [ -z "$RM_ID" ]; then
            echo "::error::Rich Menu create failed: $resp"
            exit 1
          fi
          echo "RICH_MENU_ID=$RM_ID" >> $GITHUB_ENV
          echo "::notice::Created new Rich Menu: $RM_ID"

      - name: Upload Rich Menu binary (skip if already uploaded)
        if: github.event_name != 'push' && (env.LINE_IS_THIS_WORKER == 'true' || inputs.take_over_line)
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ls -la assets/exports/pop-monster-richmenu-2500x1686.jpg

          # Probe: does this rich menu already have a binary?
          set +e
          probe_http=$(curl -sS -o /tmp/probe -w "%{http_code}" \
            "https://api-data.line.me/v2/bot/richmenu/${RICH_MENU_ID}/content" \
            -H "Authorization: Bearer $LINE_TOKEN")
          set -e
          probe_size=$(wc -c < /tmp/probe 2>/dev/null || echo 0)
          echo "probe: HTTP $probe_http, $probe_size bytes"

          if [ "$probe_http" = "200" ] && [ "$probe_size" -gt 1000 ]; then
            echo "::notice::Binary already uploaded ($probe_size bytes), skipping"
            exit 0
          fi

          curl -sS -f -X POST \
            "https://api-data.line.me/v2/bot/richmenu/${RICH_MENU_ID}/content" \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: image/jpeg" \
            --data-binary @assets/exports/pop-monster-richmenu-2500x1686.jpg
          echo "::notice::Rich Menu binary uploaded"

      - name: Set Rich Menu as default (via Python requests — defeats Akamai 411)
        id: set_default
        if: github.event_name != 'push' && (env.LINE_IS_THIS_WORKER == 'true' || inputs.take_over_line)
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          pip install --quiet requests
          python3 - <<'PY'
          import os, sys, requests
          rm_id = os.environ['RICH_MENU_ID']
          token = os.environ['LINE_TOKEN']
          r = requests.post(
              f'https://api.line.me/v2/bot/user/all/richmenu/{rm_id}',
              headers={'Authorization': f'Bearer {token}'},
              timeout=15,
          )
          print(f'HTTP {r.status_code}: {r.text}')
          if r.status_code != 200:
              sys.exit(f'set-default failed: {r.status_code} {r.text}')
          PY
          echo "::notice::Default rich menu set"

      - name: Set LINE webhook URL
        id: set_webhook
        if: github.event_name != 'push' && (env.LINE_IS_THIS_WORKER == 'true' || inputs.take_over_line)
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -f -X PUT \
            https://api.line.me/v2/bot/channel/webhook/endpoint \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"endpoint\":\"$WORKER_URL\"}"
          echo "::notice::Webhook URL set to $WORKER_URL"

      # Only meaningful when customers' events reach this worker.
      - name: Test webhook from LINE side
        if: env.LINE_IS_THIS_WORKER == 'true' || steps.set_webhook.outcome == 'success'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # LINE signs an event-less request with the real channel secret and
          # sends it to the worker. Anything but success means real events would
          # be rejected. Retried because LINE-side timeouts happen.
          for attempt in 1 2 3; do
            resp=$(curl -sS -X POST \
              https://api.line.me/v2/bot/channel/webhook/test \
              -H "Authorization: Bearer $LINE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"endpoint\":\"$WORKER_URL\"}" || true)
            echo "$resp" | jq . 2>/dev/null || echo "$resp"
            if echo "$resp" | jq -e '.success == true' > /dev/null 2>&1; then
              echo "::notice::Webhook verification: SUCCESS"
              exit 0
            fi
            if [ "$attempt" != "3" ]; then
              sleep 10
            fi
          done
          echo "::error::LINE's webhook test did not succeed after 3 tries; real customer messages may be rejected. Last response: $resp"
          exit 1

      - name: How to roll back
        if: failure() && steps.upload.outcome == 'success'
        env:
          SET_DEFAULT_OUTCOME: ${{ steps.set_default.outcome }}
          SET_WEBHOOK_OUTCOME: ${{ steps.set_webhook.outcome }}
        run: |
          echo "::error::The new code is live but a later check failed. Put back the version that was serving before this run: npx wrangler rollback ${PREV_VERSION_ID} --name ${WORKER_NAME}"
          echo "## Roll back" >> $GITHUB_STEP_SUMMARY
          echo "Worker code: \`npx wrangler rollback ${PREV_VERSION_ID} --name ${WORKER_NAME}\`" >> $GITHUB_STEP_SUMMARY

          case "$SET_DEFAULT_OUTCOME $SET_WEBHOOK_OUTCOME" in
            *success*|*failure*) ;;
            *) exit 0 ;;
          esac
          # The default menu or webhook step ran, so customers may already see a
          # different menu or be sent to this worker. Rolling back the code does not undo that.
          prev_ep="${PREV_WEBHOOK_ENDPOINT:-unknown}"
          prev_menu="${PREV_DEFAULT_RICH_MENU_ID:-unknown}"
          echo "::error::This run may have changed LINE settings (default menu: ${SET_DEFAULT_OUTCOME:-skipped}, webhook: ${SET_WEBHOOK_OUTCOME:-skipped}). Rolling back the code does not undo that. Webhook URL before: ${prev_ep}; default rich menu before: ${prev_menu}."
          {
            echo ""
            echo "**This run may have changed LINE settings — rolling back the code does not undo them.** If the values below are what LINE has now, nothing needs putting back."
            echo ""
            echo "- Webhook URL before this run: \`${prev_ep}\` — LINE Developers Console → Messaging API → Webhook URL → Edit → Update"
            case "$prev_menu" in
              none|oa-manager) echo '- There was no default rich menu set through the API before (none, or one set in LINE Official Account Manager): `curl -X DELETE -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" https://api.line.me/v2/bot/user/all/richmenu`' ;;
              unknown) echo "- The previous default rich menu could not be read; list the menus with \`GET https://api.line.me/v2/bot/richmenu/list\` and pick the right one" ;;
              *)       echo "- Default rich menu before this run: \`${prev_menu}\` — \`curl -X POST -H \"Content-Length: 0\" -H \"Authorization: Bearer \$LINE_CHANNEL_ACCESS_TOKEN\" https://api.line.me/v2/bot/user/all/richmenu/${prev_menu}\`" ;;
            esac
          } >> $GITHUB_STEP_SUMMARY

      - name: Deploy summary
        run: |
          echo "## Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Worker URL | \`$WORKER_URL\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version before this run | \`$PREV_VERSION_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| LINE sends this OA's events here | $LINE_IS_THIS_WORKER |" >> $GITHUB_STEP_SUMMARY
          if [ -z "${RICH_MENU_ID:-}" ]; then
            echo "| Rich Menu / Webhook URL | not touched |" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "| Rich Menu ID | \`$RICH_MENU_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Webhook | configured |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Manual steps remaining" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **LINE Developers Console** → Messaging API tab:" >> $GITHUB_STEP_SUMMARY
          echo "   - Auto-reply messages: OFF" >> $GITHUB_STEP_SUMMARY
          echo "   - Greeting messages: OFF" >> $GITHUB_STEP_SUMMARY
          echo "   - Use webhook: ON" >> $GITHUB_STEP_SUMMARY
          echo "2. **LINE OA Manager** → upload Avatar + Cover from \`assets/exports/\`" >> $GITHUB_STEP_SUMMARY
          echo "3. **Self-test**: add bot as friend, send \`鍍膜\` / \`產品\` / \`教學\`" >> $GITHUB_STEP_SUMMARY
          echo "4. **AI fallback test**: send a question NOT in 13 keywords (e.g. \`鍍膜跟蠟可以一起用嗎\`)" >> $GITHUB_STEP_SUMMARY
